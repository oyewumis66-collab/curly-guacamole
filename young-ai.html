<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young - AI Football Expert Chatbot</title>
    <link rel="stylesheet" href="young-ai-style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <h1>🤖 Young</h1>
                <span class="status online">🟢 Online (AI Powered)</span>
            </div>
            <p class="tagline">Intelligent AI Assistant | Football & Goalkeeping Expert</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="typing-indicator hidden" id="typingIndicator">
            <div class="spinner"></div>
            <span>Young is thinking...</span>
        </div>

        <div class="chat-input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask Young anything about football, goalkeeping, or any topic..."
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

        <div class="info-bar">
            <p>💡 Powered by Hugging Face Transformers | Ask about football, goalkeeping, or general topics!</p>
        </div>
    </div>

    <script src="young-ai.js"></script>
</body>
</html>
