<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young - AI Chatbot</title>
    <link rel="stylesheet" href="young-chatbot.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <h1>Young</h1>
                <span class="status online">🟢 Online</span>
            </div>
            <p class="tagline">Your AI Assistant | Football Expert</p>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask me anything about football, goalkeeping, or anything else..."
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="young-responses.js"></script>
    <script src="young-chatbot.js"></script>
</body>
</html>
